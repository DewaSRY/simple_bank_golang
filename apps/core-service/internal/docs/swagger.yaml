basePath: /api/v1
definitions:
  api.AuthResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      token_type:
        type: string
    type: object
  api.FieldError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  api.Meta:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  api.accountEntriesViewResponse:
    properties:
      account_id:
        type: integer
      account_name:
        type: string
      account_number:
        type: string
      amount:
        type: string
      description:
        type: string
      id:
        type: integer
      is_main:
        type: boolean
      to_account_id:
        type: integer
      to_account_name:
        type: string
      to_account_number:
        type: string
      type:
        type: string
      user_id:
        type: integer
    type: object
  api.accountResponse:
    properties:
      balance:
        type: string
      created_at:
        type: string
      currency:
        type: string
      description:
        type: string
      id:
        type: integer
      is_main:
        type: boolean
      name:
        type: string
      number:
        type: string
      user_id:
        type: integer
    type: object
  api.accountuserResponse:
    properties:
      balance:
        type: string
      created_at:
        type: string
      currency:
        type: string
      description:
        type: string
      id:
        type: integer
      is_main:
        type: boolean
      name:
        type: string
      number:
        type: string
      user_id:
        type: integer
      username:
        type: string
    type: object
  api.createAccountRequest:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  api.createTransactionTransferRequest:
    properties:
      amount:
        type: number
      description:
        type: string
      from_account_id:
        minimum: 1
        type: integer
      to_account_id:
        minimum: 1
        type: integer
    required:
    - from_account_id
    - to_account_id
    type: object
  api.deleteAccountResponse:
    properties:
      account:
        $ref: '#/definitions/api.accountResponse'
      balance_swept_to_account_id:
        type: integer
    type: object
  api.depositRequest:
    properties:
      amount:
        type: number
      description:
        type: string
    type: object
  api.errorBody:
    properties:
      code:
        type: string
      details:
        items:
          $ref: '#/definitions/api.FieldError'
        type: array
      message:
        type: string
    type: object
  api.errorResponse:
    properties:
      error:
        $ref: '#/definitions/api.errorBody'
    type: object
  api.loginUserRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  api.profileResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      username:
        type: string
    type: object
  api.publicAccountResponse:
    properties:
      id:
        type: integer
      name:
        type: string
      number:
        type: string
      user_id:
        type: integer
      username:
        type: string
    type: object
  api.registerUserRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
      password_confirm:
        type: string
      username:
        type: string
    required:
    - email
    - password
    - password_confirm
    - username
    type: object
  api.successResponse:
    properties:
      data: {}
      message:
        type: string
      meta: {}
    type: object
  api.updateAccountRequest:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
info:
  contact: {}
  description: API of simple bank application.
  title: Core Simple bank application
  version: "1.0"
paths:
  /accounts:
    get:
      description: List accounts owned by the authenticated user, paginated
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.successResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.accountuserResponse'
                  type: array
                meta:
                  $ref: '#/definitions/api.Meta'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: List accounts
      tags:
      - accounts
    post:
      consumes:
      - application/json
      description: Create a bank account for the authenticated user
      parameters:
      - description: Account creation payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.createAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.successResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.accountResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: Create a new account
      tags:
      - accounts
  /accounts/{id}:
    delete:
      description: Soft-delete an account owned by the authenticated user, sweeping
        any remaining balance to the user's main account
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.successResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.deleteAccountResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: Delete an account
      tags:
      - accounts-manage
    get:
      description: Retrieve the details of an account owned by the authenticated user
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.successResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.accountuserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: Get account details
      tags:
      - accounts-manage
    put:
      consumes:
      - application/json
      description: Update the name and/or description of an account owned by the authenticated
        user
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: integer
      - description: Account update payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.updateAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.successResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.accountResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: Update an account
      tags:
      - accounts-manage
  /accounts/{id}/deposit:
    post:
      consumes:
      - application/json
      description: Deposit money into an account owned by the authenticated user
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: integer
      - description: Deposit payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.depositRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.successResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.accountEntriesViewResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: Deposit into an account
      tags:
      - accounts-transaction
  /accounts/{id}/entries:
    get:
      description: List ledger entries for an account owned by the authenticated user,
        paginated
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: integer
      - description: Month (1-12), defaults to the current month
        in: query
        name: month
        type: integer
      - description: Year, defaults to the current year
        in: query
        name: year
        type: integer
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.successResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.accountEntriesViewResponse'
                  type: array
                meta:
                  $ref: '#/definitions/api.Meta'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: List account entries
      tags:
      - accounts-transaction
  /accounts/{id}/recent-destinations:
    get:
      description: List accounts recently transferred to from an account owned by
        the authenticated user
      parameters:
      - description: Source account ID
        in: path
        name: id
        required: true
        type: integer
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.successResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.publicAccountResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: List recent transfer destinations
      tags:
      - accounts-transaction
  /accounts/search-by-number:
    get:
      description: Look up a destination account by its account number, for picking
        a transfer destination
      parameters:
      - description: Account number
        in: query
        name: number
        required: true
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.successResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.accountuserResponse'
                  type: array
                meta:
                  $ref: '#/definitions/api.Meta'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: Search an account by number
      tags:
      - accounts
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user and return an access token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.loginUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.successResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      summary: Login
      tags:
      - auth
  /auth/profile:
    get:
      description: Retrieve the profile of the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.successResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.profileResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: Get profile
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user and return an access token
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.registerUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.successResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      summary: Register
      tags:
      - auth
  /health:
    get:
      description: Report service health status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.successResponse'
      summary: Health check
      tags:
      - health
  /transactions/transfer:
    post:
      consumes:
      - application/json
      description: Transfer money from an account owned by the authenticated user
        to another account
      parameters:
      - description: Transfer payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.createTransactionTransferRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.successResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.accountEntriesViewResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: Transfer funds
      tags:
      - transactions
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and the JWT access token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
