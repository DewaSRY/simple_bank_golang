# Reverse proxy + per-IP rate limiter in front of core-service, for local
# `docker compose up`. Mirrors infra/terraform/nginx.conf.tpl (the same
# setup deployed to EC2) but as a plain static file, since docker-compose
# has no templating step — keep the two in sync by hand if you change one.
#
# core-service isn't published on the host at all (see docker-compose.yaml)
# — this is the only way in, same as production.

limit_req_zone $binary_remote_addr zone=core_service:10m rate=25r/s;

server {
    listen 80;
    server_name _;

    location / {
        limit_req zone=core_service burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://core-services:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
