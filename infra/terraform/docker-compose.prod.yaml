# Rendered by main.tf's local.docker_compose_yml and shipped to the instance
# base64-encoded inside user_data.sh.tpl, the same way nginx.conf.tpl is.
# Lives at /opt/core-service/docker-compose.yml on the instance, alongside
# app.env and nginx.conf (both written by user_data.sh.tpl into the same
# directory) — `docker compose` picks up app.env automatically via env_file.
services:
  core-service:
    image: ${docker_image}
    container_name: core-service
    restart: unless-stopped
    networks:
      - core-service-net
    # Bound to 127.0.0.1 only, for SSH-side debugging (curl from the instance
    # itself) — not reachable from outside since it's not in the security
    # group. The public entrypoint is nginx below.
    ports:
      - "127.0.0.1:${app_port}:${app_port}"
    env_file:
      - app.env

  nginx:
    image: ${nginx_image}
    container_name: nginx
    restart: unless-stopped
    networks:
      - core-service-net
    ports:
      - "${nginx_port}:${nginx_port}"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - core-service

networks:
  core-service-net:
    name: core-service-net
