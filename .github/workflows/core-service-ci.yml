name: core-service CI

on:
  push:
    branches: [main]
    paths:
      - "apps/core-service/**"
      - ".github/workflows/core-service-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/core-service/**"
      - ".github/workflows/core-service-ci.yml"

defaults:
  run:
    working-directory: apps/core-service

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: simple_bank
          POSTGRES_PASSWORD: password
          POSTGRES_DB: simple_bank
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U simple_bank -d simple_bank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/core-service/go.mod
          cache-dependency-path: apps/core-service/go.sum

      - name: Install golang-migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.1/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/local/bin/migrate

      - name: Run migrations
        run: migrate -path internal/db/migrations -database "postgresql://simple_bank:password@localhost:5433/simple_bank?sslmode=disable" up

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  deploy:
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/core-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push core-service image
        run: |
          docker buildx build --platform linux/amd64 \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/core-service-dep:latest \
            --push -f Dockerfile.prod .

      # The instance runs core-service + nginx as a compose stack at
      # /opt/core-service (docker-compose.yml rendered by
      # infra/terraform/docker-compose.prod.yaml). This only touches the
      # core-service service — nginx, app.env, and the compose file itself
      # only change via `make tf-redeploy`.
      - name: Redeploy on EC2 over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/core-service
            docker compose pull core-service
            docker compose up -d core-service
