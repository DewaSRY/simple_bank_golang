services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: simple_bank
      POSTGRES_PASSWORD: password
      POSTGRES_DB: simple_bank
    ports:
      - "5433:5432"
    volumes:
      - simple_bank_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simple_bank -d simple_bank"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Not published on the host — only reachable through nginx below, same as
  # the production EC2 deploy (see infra/terraform).
  core-services:
    image: core-service:latest
    environment:
      DB_DRIVER: postgres
      DB_SOURCE: "postgresql://simple_bank:password@postgres:5432/simple_bank?sslmode=disable"
      SERVER_ADDRESS: "0.0.0.0:8080"
      JWT_SECRET_KEY: "46cb893a8ab20cb9042f3bdb49747c4fc813fb04a370aa2b16d7feaf30367fad"
      JWT_ACCESS_TOKEN_DURATION: "600m"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,https://simplebankportal.vercel.app"
      LOG_LEVEL: "info"
      LOG_FORMAT: "json"
    depends_on:
      postgres:
        condition: service_healthy

  # Reverse proxy + rate limiter in front of core-services. Keeps port 8080
  # as the address clients already use (apps/portal's default
  # NEXT_PUBLIC_API_URL) — nginx just takes over that port instead of
  # core-services publishing it directly.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./apps/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - core-services

volumes:
  simple_bank_postgres_data:
